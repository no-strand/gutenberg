{# Usado por EPUB, roteiro e Rascunho → Informações. #}
<div class="page-jump-controls" role="group" aria-label="{{ t('navigation.page_list') }}">
  <button type="button" class="{{ page_jump_button_class }} page-jump-button" data-page-jump="first" title="{{ t('navigation.first_page') }} (Ctrl+Alt+Home)" aria-label="{{ t('navigation.first_page') }} (Ctrl+Alt+Home)">⇤</button>
  <button type="button" class="{{ page_jump_button_class }} page-jump-button" data-page-jump="list" title="{{ t('navigation.page_list') }} (Ctrl+Alt+P)" aria-label="{{ t('navigation.page_list') }} (Ctrl+Alt+P)" aria-haspopup="dialog" aria-controls="modalNavegacaoFolhas">☷</button>
  <button type="button" class="{{ page_jump_button_class }} page-jump-button" data-page-jump="last" title="{{ t('navigation.last_page') }} (Ctrl+Alt+End)" aria-label="{{ t('navigation.last_page') }} (Ctrl+Alt+End)">⇥</button>
</div>
